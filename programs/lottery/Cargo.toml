[package]
name = "lottery"
version = "0.1.0"
description = "On-chain lottery program for sol-lottery"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lottery"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
orao-solana-vrf = { version = "0.7.0", default-features = false, features = ["cpi"] }
